server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name hero.abcelearning.qzz.io;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name credentials-vault-api.abcelearning.qzz.io;
    root /usr/share/nginx/html;

    location = / {
        try_files /test.html =404;
    }

    location / {
        try_files $uri =404;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 3000 default_server;
    listen [::]:3000 default_server;
    server_name _;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 404;
    }
}
