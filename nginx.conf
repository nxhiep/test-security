server {
    listen 80;
    server_name hero.abcelearning.qzz.io;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name credentials-vault-api.abcelearning.qzz.io;
    root /usr/share/nginx/html;

    location = / {
        try_files /test.html =404;
    }

    location / {
        try_files $uri =404;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
